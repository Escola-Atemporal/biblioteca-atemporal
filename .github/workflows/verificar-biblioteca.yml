name: Verificar Biblioteca Atemporal

on:
  push:
    branches: [main]
    paths:
      - "vercel-app/**"
      - ".github/workflows/verificar-biblioteca.yml"
  pull_request:
    paths:
      - "vercel-app/**"
      - ".github/workflows/verificar-biblioteca.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar e verificar tipos
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: vercel-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar imagens e compilar Next.js
        run: npm run build
