name: Publicar Biblioteca Atemporal

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'acervo.html'
      - '.nojekyll'
      - 'data/catalogo-publico.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar site estatico
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos publicos
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp acervo.html _site/acervo.html
          cp .nojekyll _site/.nojekyll
          mkdir -p _site/data
          cp data/catalogo-publico.json _site/data/catalogo-publico.json
      - name: Enviar arquivos para publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
