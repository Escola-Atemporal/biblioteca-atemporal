name: Verificar aplicativo Vercel

on:
  push:
    branches: [main]
    paths:
      - "vercel-app/**"
      - ".github/workflows/vercel-app-check.yml"
  pull_request:
    paths:
      - "vercel-app/**"
      - ".github/workflows/vercel-app-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar tipos e compilar
        run: npm run build
