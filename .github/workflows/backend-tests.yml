name: Verificar backend da Biblioteca

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: biblioteca_ci
          POSTGRES_USER: biblioteca_ci
          POSTGRES_PASSWORD: ci_only_not_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca_ci -d biblioteca_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://biblioteca_ci:ci_only_not_production@localhost:5432/biblioteca_ci
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar sintaxe
        run: python -m compileall -q app.py tests
      - name: Testar autenticacao e permissoes
        run: python -m pytest -q
